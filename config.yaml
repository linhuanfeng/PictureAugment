# YOLO数据增强配置文件

# 输入根目录
# input_images_root: "./data/images"
# input_labels_root: "./data/labels"

# # 输出根目录
# output_images_root: "./data/augmented/images"
# output_labels_root: "./data/augmented/labels"

input_images_root: "/media/xiaozhang/7b92dbd7-9b4b-479a-82aa-eea1734006a21/other_workspace/dataset/datasetsv3_origin/images"
input_labels_root: "/media/xiaozhang/7b92dbd7-9b4b-479a-82aa-eea1734006a21/other_workspace/dataset/datasetsv3_origin/labels"

# 输出根目录
output_images_root: "/media/xiaozhang/7b92dbd7-9b4b-479a-82aa-eea1734006a21/other_workspace/dataset/datasetsv3_origin/images"
output_labels_root: "/media/xiaozhang/7b92dbd7-9b4b-479a-82aa-eea1734006a21/other_workspace/dataset/datasetsv3_origin/labels"

# 要增强的数据集（train/val/test）
datasets:
  - train
  - val

# 每张图像生成的增强数量
num_augments: 8

# 并行进程数。不填则取 CPU 核数的 3/4；填 1 表示单进程（调试时用）
# workers: 12

# 变换配置
transforms:
  # 旋转变换
  rotate:
    enabled: true
    angle_range: [-30, 30]  # 旋转角度范围
    p: 0.5  # 应用概率
    # 必转角度：下面每个角度，每张图都会额外生成一张精确旋转的图（逆时针为正，90 和 270 对应手机竖拍的两个方向）
    # 不需要时删掉这三项，或把 fixed_angles 设为 []
    fixed_angles: [90, 270]
    fixed_jitter: 15  # 在每个必转角度附近随机偏移 ±15 度，模拟手持没拿正
    fixed_jitter_copies: 2  # 每个必转角度再额外生成几张带偏移的图（0 表示只要精确角度）

  # 随机遮挡
  mask:
    enabled: true
    num_masks: [1, 5]  # 遮挡块数量范围
    size_range: [0.02, 0.1]  # 遮挡块大小比例
    p: 0.5

  # 透视畸变
  distort:
    enabled: true
    range: 0.1  # 畸变强度
    p: 0.5

  # 高斯噪声
  gaussian_noise:
    enabled: true
    mean: 0  # 噪声均值
    std_range: [10, 50]  # 噪声标准差范围
    p: 0.5

  # HSV色调变换
  hsv_adjust:
    enabled: true
    hue_range: [-0.1, 0.1]  # 色调偏移范围（-0.1到0.1表示±18度）
    saturation_range: [0.7, 1.3]  # 饱和度缩放范围
    value_range: [0.7, 1.3]  # 明度缩放范围
    p: 0.5

  # 灰度化（黑白）
  grayscale:
    enabled: true
    p: 0.5

  # 强光（亮度增强）
  brightness_boost:
    enabled: true
    brightness_range: [1.2, 1.8]  # 亮度增强倍数范围
    p: 0.5
